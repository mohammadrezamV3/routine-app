# کانفیگ آماده‌ی arionapp.ir — کپی روی سرور:
#
#   sudo cp deploy/nginx.arionapp.ir.conf /etc/nginx/sites-available/routine-app
#   sudo ln -s /etc/nginx/sites-available/routine-app /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ certbot لازم نیست — بلوکِ ۴۴۳ این فایل از گواهیِ Cloudflare Origin CA
# استفاده می‌کنه (رایگان، از داشبوردِ Cloudflare می‌گیریش)، نه Let's
# Encrypt. جزئیاتِ کامل توی کامنتِ زیر همین خط.
#
# این فایل رو با دامنه‌ی خودت جایگزین کن و توی
# /etc/nginx/sites-available/routine-app بذار (راهنمای کامل در چت).
#
# نسخه‌ی هماهنگ با Cloudflare — حالتِ SSL/TLS مود = **Full (strict)**:
# بینِ Cloudflare و این سرور هم رمزنگاری‌شده (نه فقط بینِ Cloudflare و
# بازدیدکننده). برای همین یه گواهیِ Cloudflare Origin CA (رایگان، ۱۵ساله)
# روی پورتِ ۴۴۳ لازمه — نه Let's Encrypt/certbot (چون بازدیدکننده هیچ‌وقت
# مستقیم به این سرور وصل نمی‌شه، فقط Cloudflare؛ و Cloudflare به گواهیِ
# خودش اعتماد داره، نه به CA عمومی).
#
# راه‌اندازی (یک‌بار):
#   ۱. Cloudflare → SSL/TLS → Origin Server → Create Certificate
#      (کلیدِ خصوصی RSA، Hostnames: arionapp.ir و *.arionapp.ir، اعتبار ۱۵ سال)
#   ۲. محتوای «Origin Certificate» رو بریز توی:
#        sudo mkdir -p /etc/nginx/ssl
#        sudo nano /etc/nginx/ssl/cloudflare-origin.pem
#      و «Private Key» رو توی:
#        sudo nano /etc/nginx/ssl/cloudflare-origin.key
#        sudo chmod 600 /etc/nginx/ssl/cloudflare-origin.key
#   ۳. sudo nginx -t && sudo systemctl reload nginx
#   ۴. Cloudflare → SSL/TLS → Overview → **Full (strict)**
#
# چرا این تغییر لازم شد: قبلاً حالت Flexible بود (Cloudflare↔سرور رمزنگاری‌
# نشده، فقط پورتِ ۸۰). آن حالت با یه مشکلِ زیرساختیِ جداگانه (کندی/افتِ
# کیفیتِ مسیرِ بین‌المللیِ Cloudflare↔سرور) ترکیب شد و باعث می‌شد فایل‌های
# استاتیکِ بزرگ (مثلِ CSS ساخته‌شده از globals.css) گاهی وسط‌راه بریده و
# به‌عنوانِ پاسخِ «کامل» کش/تحویل بشن — یعنی سایت بدونِ استایل لود می‌شد.
# رمزنگاریِ این مسیر تضمینِ صددرصد نیست ولی محتمله جلوی این نوعِ دخالت/
# throttlingِ مبتنی‌بر-محتوا رو بگیره. اگه بعدِ این تغییر بازم تکرار شد،
# قدمِ بعدی فعال‌کردنِ Argo Smart Routing (پولی، توی داشبوردِ Cloudflare) ه.
#
# نکته‌ی امنیتیِ مهم: وقتی Cloudflare جلوی سایته، IPِ واقعیِ بازدیدکننده
# توی هدرِ CF-Connecting-IP میاد، نه $remote_addr (که IP خودِ Cloudflare
# می‌شه). این هدر رو به X-Forwarded-For پاس می‌دیم تا rate limiting سمتِ
# اپ (lib/rateLimit.ts، با TRUST_PROXY_HEADERS=1) درست کار کنه.

map $http_cf_connecting_ip $real_client_ip {
    default         $http_cf_connecting_ip;
    ""              $remote_addr;
}

# ⚠️ اگه سایت «گاهی بالا نمیاد و با چندبار ریلود درست می‌شه»، اول همین بخش
# رو روی سرورِ خودت (/etc/nginx/sites-available/routine-app) چک کن — به‌روز
# شدنِ این فایلِ نمونه توی گیت، فایلِ زنده‌ی سرور رو عوض نمی‌کنه.
#
# باگِ کلاسیکِ nginx که قبلاً این‌جا بود: `proxy_set_header Connection "upgrade"`
# به‌صورت ثابت روی *همه‌ی* درخواست‌ها ست شده بود، نه فقط WebSocket. برای یه
# درخواستِ HTTPِ معمولی (که $http_upgrade خالیه) این یعنی nginx به Node
# می‌گه «این کانکشن داره upgrade می‌شه» — نتیجه‌ش خراب‌شدنِ keep-alive و
# کانکشن‌هایی که بی‌دلیل باز می‌مونن/نیمه‌کاره بسته می‌شن. دقیقاً همون رفتارِ
# «گاهی بالا نمیاد، ریلود می‌زنم درست می‌شه».
#
# تنها WebSocketِ اپ مسیرِ `/ws`ـه که locationِ جدای خودش رو داره (پایین)؛
# بقیه‌ی مسیرها اصلاً هدرِ Upgrade رو پاس نمی‌دن و کلِ این دسته باگ بسته می‌شه —
# به‌جاش `Connection ""` می‌ذاریم تا کانکشن‌پولِ keepaliveِ بالا واقعاً
# استفاده بشه (وگرنه برای هر درخواست یه TCP handshakeِ تازه زده می‌شه).

# کانکشن‌پولِ keep-alive به سمتِ Next — بدونِ این، nginx برای *هر* درخواست یه
# TCP handshake تازه به 127.0.0.1:3000 می‌زنه.
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    # پورتِ ۴۴۳ برای اتصالِ رمزنگاری‌شده‌ی Cloudflare→سرور (حالتِ Full/Full
    # strict). گواهی از Cloudflare Origin CA میاد، نه Let's Encrypt —
    # راهنمای ساختش توی کامنتِ بالای فایل. اگه این دو فایل هنوز نساختیش،
    # `nginx -t` روی این بلاک خطا می‌ده؛ تا وقتی گواهی رو نساختی این دو خط
    # `listen 443 ssl` و دو خطِ ssl_certificate رو کامنت کن.
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    server_name arionapp.ir www.arionapp.ir;

    # فشرده‌سازی — بزرگ‌ترین بخشِ payloadِ این اپ JS و CSSه.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/javascript image/svg+xml
               application/manifest+json font/woff2;

    # دارایی‌های استاتیکِ نکست هش‌دار هستن (اسمشون با هر build عوض می‌شه)،
    # پس می‌شه تا ابد کششون کرد — این‌جوری مرورگرِ بازدیدکننده‌ی برگشتی
    # اصلاً به Node نمی‌رسه.
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # روت‌های پرداخت باید مهلتِ بیشتری داشته باشند: این‌ها منتظرِ پاسخِ یک
    # درگاهِ *بیرونی* (زیبال/زرین‌پال) می‌مانند، و درگاه‌های ایرانی در ساعاتِ
    # شلوغ می‌توانند چند ثانیه طول بکشند.
    #
    # با ۱۵ ثانیه‌ی پیش‌فرضِ `location /`، یک درگاهِ کند باعث می‌شد nginx اتصال
    # را ببندد و یک صفحه‌ی **HTML** با کدِ ۵۰۴ بدهد؛ کلاینت که منتظرِ JSON بود
    # روی `res.json()` خطا می‌خورد و کاربر پیامِ گمراه‌کننده‌ی «مشکلی در اتصال
    # به سرور پیش اومد» را می‌دید — بدونِ هیچ سرنخی از دلیلِ واقعی.
    #
    # خودِ اپ تایم‌اوتِ ۱۲ ثانیه‌ای روی فراخوانیِ درگاه دارد (lib/zibal.ts و
    # lib/zarinpal.ts)، پس این عدد فقط باید از آن *بیشتر* باشد تا همیشه اپ
    # زودتر تصمیم بگیرد و یک خطای JSONِ فارسیِ دقیق برگرداند.
    # روت‌های هوش مصنوعی (گزارش هفتگی، رودمپ‌ساز) ذاتاً کندند — تولیدِ متن
    # چند ده ثانیه طول می‌کشد. با ۱۵ ثانیه‌ی `location /` این‌ها همیشه از
    # سمتِ nginx کشته می‌شدند و یک ۵۰۴ـِ HTML می‌دادند، که کلاینت نمی‌توانست
    # پارسش کند و کاربر «مشکلی در اتصال به سرور» می‌دید.
    # خودِ اپ تایم‌اوتِ کلِ ۵۵ثانیه‌ای دارد (AI_TOTAL_BUDGET_MSِ lib/aiClient.ts
    # — بودجه‌ی *کلِ* هر دو تلاش، نه هر تلاش جدا)، پس این باید از آن بیشتر
    # باشد تا همیشه اپ زودتر تصمیم بگیرد و خطای فارسیِ JSON برگرداند.
    #
    # ⚠️ باگِ قبلی همین‌جا: `^/api/(reports|roadmaps)/` یک "/" را بعدِ
    # اسم مسیر اجباری می‌کرد، یعنی خودِ `POST /api/roadmaps` (درخواستِ
    # اصلیِ *ساختِ* رودمپ — بدون هیچ‌چیزی بعدش) اصلاً match نمی‌شد و به‌جاش
    # می‌افتاد روی `location /` با فقط ۱۵ ثانیه — دقیقاً همان چیزی که
    # باعث می‌شد «رودمپ توی ساخت گیر کند» (nginx بعد از ۱۵s کانکشن را
    # می‌بست، خیلی قبل از این‌که AI اصلاً فرصتِ جواب‌دادن داشته باشد).
    # `(/|$)` هم خودِ مسیر را می‌گیرد هم زیرمسیرهایش را. همین‌طور
    # `exercise/plan` و `calorie/scan` (که آن‌ها هم AI صدا می‌زنند) اضافه شدند.
    location ~ ^/api/(analysis|roadmaps|exercise/plan|calorie/scan|routine/assistant)(/|$) {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        # ۱۳۰s: ساختِ دوباره‌ی یک مرحله‌ی رودمپ با جزئیاتِ کامل تا ۱۲۰s طول می‌کشد
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    location ~ ^/api/(subscription|payment)/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # WebSocketِ realtime (`/ws`، lib/realtimeServer.ts) — *فقط* همین مسیر
    # هدرِ Upgrade رو پاس می‌ده؛ بقیه‌ی locationها عمداً `Connection ""` دارن
    # (باگِ keep-aliveِ بالا دوباره برنمی‌گرده). نبودِ این بلوک یعنی
    # «پیام‌ها لایو نمیان» (کلاینت بی‌صدا به polling برمی‌گرده).
    #  • Host پاس داده می‌شه چون سرور Originِ مرورگر رو با همین Host مقایسه
    #    می‌کنه (ضدِ Cross-Site WebSocket Hijacking).
    #  • read_timeout بلند: سرور هر ۳۰ثانیه ping می‌فرسته، پس ۷۵s یعنی فقط
    #    اتصالِ واقعاً مرده بسته می‌شه. Cloudflare هم WebSocket رو (حتی در
    #    حالتِ Flexible) خودکار پروکسی می‌کنه.
    #  • با cluster.js، سوکت روی هر workerی بیفته فرقی نمی‌کنه — fan-out بینِ
    #    workerها با LISTEN/NOTIFYِ Postgres (کانالِ arion_rt) انجام می‌شه.
    location = /ws {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        access_log off;
    }

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        # عمداً هدرِ Upgrade پاس داده نمی‌شه (بالا توضیح داده شده) و
        # `Connection ""` یعنی keepalive به سمتِ Node فعال بمونه.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $real_client_ip;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto https;

        # پیش‌فرضِ nginx برای این‌ها ۶۰ ثانیه‌ست؛ یعنی اگه Node یه لحظه گیر
        # کنه، بازدیدکننده یک دقیقه‌ی تمام روی صفحه‌ی سفید می‌مونه. ۱۵ ثانیه
        # برای این اپ سخاوتمندانه‌ست — روت‌های واقعاً کندِ AI (رودمپ/گزارش
        # هفتگی/برنامه‌ی تمرینی/اسکنِ غذا) همگی بالا (locationِ دیگر)
        # مهلتِ ۷۰ثانیه‌ی خودشان را دارند، این‌جا فقط بقیه‌ی مسیرهای عادی‌اند.
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }

    client_max_body_size 10m;
}

# ─────────────────────────────────────────────────────────────────────────
# دیباگِ «سایت بالا نمیاد»: دو روتِ سلامت داریم و تفاوتشون مهمه —
#   curl -s http://127.0.0.1:3000/api/health   → فقط می‌گه پروسه‌ی Node زنده‌ست
#   curl -s http://127.0.0.1:3000/api/ready    → واقعاً به Postgres کوئری می‌زنه
# اگه health سالم بود ولی ready با reason:"timeout" برگشت، یعنی کانکشن‌پولِ
# دیتابیس پُر شده (نه اینکه Node مرده باشه). اسکریپتِ scripts/diagnose-uptime.sh
# همه‌ی این‌ها رو یک‌جا چک می‌کنه (بخشِ ۱۰ اون اسکریپت مخصوصِ دیباگِ «سایت
# بدونِ استایل/بریده لود می‌شه» است: اندازه‌ی فایلِ CSSِ بیلد رو مستقیم از
# Node در مقابلِ از پشتِ Cloudflare مقایسه می‌کنه).
