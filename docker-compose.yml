services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-routine}
    volumes:
      - db_data:/var/lib/postgresql/data
    # چرخشِ لاگ. پیش‌فرضِ داکر (json-file بدونِ سقف) لاگ رو بی‌نهایت نگه
    # می‌داره؛ روی یه VPSِ کوچیک بعد از چند ماه دیسک پُر می‌شه و اون‌وقت هم
    # Postgres نمی‌تونه بنویسه هم Next نمی‌تونه کش بسازه — از بیرون دقیقاً
    # شبیهِ «سایت بالا نمیاد» دیده می‌شه.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routine}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # این پورت رو فقط برای دیباگ لوکال باز نگه دار؛ در production لازم نیست
    # روی اینترنت باز باشه چون app مستقیم توی همین شبکه‌ی داکر بهش وصله.
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      # این دوتا NEXT_PUBLIC_* هستن — کدِ سمتِ کلاینت همین لحظه‌ی build ازشون
      # پر می‌شه، نه در runtime؛ چون .env توی .dockerignoreست، باید صریح از
      # همین‌جا (که docker compose خودش .env رو برای ${...} می‌خونه) رد بشن.
      args:
        NEXT_PUBLIC_MARKET: ${NEXT_PUBLIC_MARKET:-IRAN}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-routine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-routine}
      # سقفِ heapِ V8. بدونِ این، Node روی یه VPSِ کوچیک سعی می‌کنه تا نزدیکِ
      # کلِ RAMِ ماشین heap بگیره و در نهایت کلِ سیستم (از جمله Postgres)
      # به swap/OOM می‌خوره — که از بیرون شبیهِ «سایت هنگ کرده» دیده می‌شه.
      NODE_OPTIONS: "--max-old-space-size=${NODE_HEAP_MB:-512}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # فقط وقتی معنا داره که سرویسِ autoheal پایین فعال شده باشه.
      autoheal: "true"
    # با این، وضعیتِ واقعیِ اپ توی `docker compose ps` دیده می‌شه (healthy /
    # unhealthy) به‌جای اینکه یه پروسه‌ی گیرکرده «در حال اجرا» گزارش بشه.
    # توجه: خودِ docker compose کانتینرِ unhealthy رو *خودکار ری‌استارت
    # نمی‌کنه* (اون قابلیتِ Swarmه) — `restart: unless-stopped` فقط وقتی
    # پروسه واقعاً exit کنه عمل می‌کنه. برای ری‌استارتِ خودکار روی unhealthy
    # باید سرویسِ autohealِ پایین رو با پروفایلش روشن کنی:
    #   docker compose --profile autoheal up -d
    # /api/health عمداً به دیتابیس دست نمی‌زنه — برای چکِ واقعیِ دیتابیس
    # /api/ready هست (نگاه کن به app/api/ready/route.ts).
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:3000:3000"

  # کانتینرِ یک‌بارمصرف برای migrate/seed — عمداً از استیجِ builder (نه runner
  # نهایی) استفاده می‌کنه چون اونجا Prisma CLI و tsx (که devDependency هستن و
  # عمداً از ایمیجِ سبکِ production حذف شدن) نصب و pin‌شده به نسخه‌ی درستِ
  # پروژه موجودن. با پروفایلِ tools، توی `docker compose up` عادی اجرا نمی‌شه.
  migrate:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-routine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-routine}
    depends_on:
      db:
        condition: service_healthy

  # ری‌استارتِ خودکارِ کانتینرِ *هنگ‌کرده* — مکملِ `restart: unless-stopped`
  # که فقط وقتی پروسه واقعاً exit کنه عمل می‌کنه. اگه Node زنده بمونه ولی
  # جواب نده، healthcheck ردیف بالا unhealthy می‌شه و این sidecar ری‌استارتش
  # می‌کنه (خودِ docker compose این کار رو نمی‌کنه؛ اون قابلیتِ Swarmه).
  #
  # ⚠️ عمداً پشتِ پروفایل گذاشته شده و پیش‌فرض *اجرا نمی‌شه*: این سرویس به
  # داکرسوکتِ هاست دسترسی می‌خواد، که عملاً یعنی دسترسیِ هم‌سطحِ root روی
  # سرور برای یه ایمیجِ شخصِ ثالث. اگه این معامله رو قبول داری:
  #   docker compose --profile autoheal up -d
  autoheal:
    image: willfarrell/autoheal:1.2.0
    profiles: ["autoheal"]
    restart: unless-stopped
    environment:
      # فقط کانتینرهایی که لیبلِ autoheal=true دارن (یعنی app)، نه هرچیزی
      # که روی این هاست unhealthy بشه.
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  db_data:
