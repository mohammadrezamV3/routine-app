services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-routine}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routine}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # این پورت رو فقط برای دیباگ لوکال باز نگه دار؛ در production لازم نیست
    # روی اینترنت باز باشه چون app مستقیم توی همین شبکه‌ی داکر بهش وصله.
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build:
      context: .
      # این دوتا NEXT_PUBLIC_* هستن — کدِ سمتِ کلاینت همین لحظه‌ی build ازشون
      # پر می‌شه، نه در runtime؛ چون .env توی .dockerignoreست، باید صریح از
      # همین‌جا (که docker compose خودش .env رو برای ${...} می‌خونه) رد بشن.
      args:
        NEXT_PUBLIC_MARKET: ${NEXT_PUBLIC_MARKET:-IRAN}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-routine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-routine}
      # سقفِ heapِ V8. بدونِ این، Node روی یه VPSِ کوچیک سعی می‌کنه تا نزدیکِ
      # کلِ RAMِ ماشین heap بگیره و در نهایت کلِ سیستم (از جمله Postgres)
      # به swap/OOM می‌خوره — که از بیرون شبیهِ «سایت هنگ کرده» دیده می‌شه.
      NODE_OPTIONS: "--max-old-space-size=${NODE_HEAP_MB:-512}"
    # با این، وضعیتِ واقعیِ اپ توی `docker compose ps` دیده می‌شه (healthy /
    # unhealthy) به‌جای اینکه یه پروسه‌ی گیرکرده «در حال اجرا» گزارش بشه.
    # توجه: خودِ docker compose کانتینرِ unhealthy رو *خودکار ری‌استارت
    # نمی‌کنه* (اون قابلیتِ Swarmه) — `restart: unless-stopped` فقط وقتی
    # پروسه واقعاً exit کنه عمل می‌کنه. برای ری‌استارتِ خودکار روی unhealthy
    # باید یه sidecar مثل willfarrell/autoheal اضافه بشه.
    # /api/health عمداً به دیتابیس دست نمی‌زنه.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:3000:3000"

  # کانتینرِ یک‌بارمصرف برای migrate/seed — عمداً از استیجِ builder (نه runner
  # نهایی) استفاده می‌کنه چون اونجا Prisma CLI و tsx (که devDependency هستن و
  # عمداً از ایمیجِ سبکِ production حذف شدن) نصب و pin‌شده به نسخه‌ی درستِ
  # پروژه موجودن. با پروفایلِ tools، توی `docker compose up` عادی اجرا نمی‌شه.
  migrate:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-routine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-routine}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
