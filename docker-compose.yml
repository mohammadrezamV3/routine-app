services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-routine}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routine}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # این پورت رو فقط برای دیباگ لوکال باز نگه دار؛ در production لازم نیست
    # روی اینترنت باز باشه چون app مستقیم توی همین شبکه‌ی داکر بهش وصله.
    # ports:
    #   - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-routine}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-routine}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db_data:
