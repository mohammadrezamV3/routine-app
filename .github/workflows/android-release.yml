name: Android Release (mobile/)

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch: {}

jobs:
  build-release:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # پیش‌فرضِ اکشن پکیجِ قدیمیِ "tools" رو نصب می‌کنه که دیگه تو sdkmanager نیست و بیلد رو می‌شکنه
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.MOBILE_API_BASE_URL }}" ]; then
            echo "::error::سکرت MOBILE_API_BASE_URL ست نشده — بدون آدرس API واقعی، بیلد ریلیز معنی نداره. توی تنظیمات ریپو (Settings > Secrets and variables > Actions) اضافه‌اش کن."
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::سکرت ANDROID_KEYSTORE_BASE64 ست نشده — بدون keystore نمی‌شه بیلد رو امضا کرد. راهنمای ساخت keystore توی mobile/RELEASE.md هست."
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] || [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "::error::یکی از سکرت‌های ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD ست نشده."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build web assets
        env:
          VITE_API_BASE_URL: ${{ secrets.MOBILE_API_BASE_URL }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/arion-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Resolve version code
        run: |
          # اگه tag به شکل mobile-vX بود از X به‌عنوان versionCode استفاده می‌شه، وگرنه از GITHUB_RUN_NUMBER
          if [[ "${GITHUB_REF_NAME}" =~ ^mobile-v([0-9]+)$ ]]; then
            echo "ANDROID_VERSION_CODE=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          else
            echo "ANDROID_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build signed APK + AAB
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify APK signature
        run: |
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/34.0.0"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "$APK_PATH"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${ANDROID_KEYSTORE_PATH}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arion-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: arion-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
